name: Build PDF

on:
  push:
    branches: [main]
    paths:
      - '**.adoc'
      - '.github/workflows/build-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Asciidoctor PDF
        run: gem install asciidoctor-pdf rouge

      - name: Build PDF
        run: asciidoctor-pdf -v WPF-Cheatsheet-de.adoc -o WPF-Cheatsheet-de.pdf

      - uses: actions/upload-artifact@v7
        with:
          name: WPF-Cheatsheet-de
          path: WPF-Cheatsheet-de.pdf

      - name: Commit updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add WPF-Cheatsheet-de.pdf
          git diff --cached --quiet || (git commit -m "PDF neu erzeugt" && git push)
